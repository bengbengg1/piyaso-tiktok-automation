# Upload this single file to .github/workflows/vsr-auto-r2.yml
# Auto-discovers new R2 media, no filenames or manually drawn masks.
# Private review only: NEVER posts to Buffer or TikTok.
name: Piyaso - R2 otomatik yazı temizleme (inceleme)

on:
  workflow_dispatch:
    inputs:
      run_ai:
        description: "Gercek OCR + STTN-DET silme (false = yalniz onizleme)"
        type: boolean
        required: true
        default: false
      max_videos:
        description: "Bu calistirmada en cok kac yeni video (1-5)"
        type: number
        required: true
        default: 2
      max_seconds:
        description: "Video basina en fazla kac saniye (0.5-90; 18=ilk test)"
        type: number
        required: true
        default: 18
      retry_failed:
        description: "Daha once hata alanlari tekrar dene"
        type: boolean
        required: true
        default: false
  schedule:
    # Scan newly uploaded media every 6 hours (UTC).
    # GitHub may delay scheduled workflow runs.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: piyaso-auto-vsr-r2-private
  cancel-in-progress: false

jobs:
  auto-review:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ASSETS_BUCKET: piyaso-tiktok-assets
      # Safe by default: scheduled runs only prepare previews until explicitly enabled.
      RUN_AI: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_ai) || (github.event_name == 'schedule' && vars.VSR_AUTO_AI_ENABLED == 'true') }}
      RETRY_FAILED: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_failed || false }}
      MAX_VIDEOS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_videos || 1 }}
      MAX_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_seconds || 18 }}
    steps:
      - name: Checkout existing Piyaso repo
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: FFmpeg and R2 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libopengl0 libglib2.0-0
          python -m pip install -r requirements.txt

      - name: Install REAL VSR pretrained STTN-DET only when AI is enabled
        if: ${{ env.RUN_AI == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts vendor
          cp get_vsr.sh scripts/get_vsr.sh
          cp setup_vsr_cpu.sh scripts/setup_vsr_cpu.sh
          chmod +x scripts/get_vsr.sh scripts/setup_vsr_cpu.sh
          bash scripts/setup_vsr_cpu.sh
          test -s vendor/video-subtitle-remover/backend/models/sttn-det/sttn.pth
          # Verify official tracked STTN-DET checkpoint, pinned to the upstream commit.
          test "$(git -C vendor/video-subtitle-remover hash-object backend/models/sttn-det/sttn.pth)" = "4b9c2458591463af28c8f5b7044a09f8689f87c1"

      - name: Run automatic R2 selection and private subtitle review
        shell: bash
        run: |
          set -euo pipefail
          # Embedded program: only ONE YAML file needs uploading to GitHub.
          cat > auto_vsr_r2.py <<'PY'
          """Private, automatic R2 -> VSR STTN-DET review pipeline.
          
          R2 inputs: backgrounds/<filename>.{mp4,mov,mkv} (direct children only)
          R2 outputs: reviews/auto_vsr/v1/<fingerprint>/{original.png,before_after.png,cleaned.mp4,preview.json,ai.json,error_<mode>.json}
          
          No publication, no Buffer access, no mutation of source files. Video upload is
          NOT evidence of commercial redistribution rights; human review/rights approval
          are separate, mandatory steps before any later publishing integration.
          """
          from __future__ import annotations
          
          import argparse
          import datetime as dt
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from dataclasses import dataclass
          from pathlib import Path
          
          from PIL import Image, ImageChops, ImageDraw, ImageStat
          
          import storage_client
          
          BUCKET = "piyaso-tiktok-assets"
          VERSION = "v1"
          MAX_SOURCE_BYTES = 80 * 1024 * 1024
          MEDIA_SUFFIXES = (".mp4", ".mov", ".mkv")
          ALLOWED_NAME = re.compile(r"^[^/\\\x00-\x1f]{1,180}$")
          
          
          @dataclass(frozen=True)
          class Video:
              key: str
              size: int
              etag: str
              last_modified: dt.datetime
          
              @property
              def fingerprint(self) -> str:
                  payload = json.dumps([VERSION, self.key, self.etag, self.size], ensure_ascii=False)
                  return hashlib.sha256(payload.encode("utf-8")).hexdigest()[:28]
          
              @property
              def prefix(self) -> str:
                  return f"reviews/auto_vsr/{VERSION}/{self.fingerprint}/"
          
          
          def valid_video_object(item: dict) -> Video | None:
              key = item.get("Key", "")
              if not isinstance(key, str) or not key.startswith("backgrounds/"):
                  return None
              name = key[len("backgrounds/"):]
              if not ALLOWED_NAME.fullmatch(name) or name in (".", "..") or ".." in name:
                  return None
              if not name.lower().endswith(MEDIA_SUFFIXES):
                  return None
              size = int(item.get("Size", 0))
              if not 0 < size <= MAX_SOURCE_BYTES:
                  return None
              when = item.get("LastModified") or dt.datetime(1970, 1, 1, tzinfo=dt.timezone.utc)
              return Video(key, size, str(item.get("ETag", "")).strip('"'), when)
          
          
          def list_videos(s3, bucket: str) -> list[Video]:
              """Read *all* pages; deterministic oldest-first, no filenames supplied."""
              found: list[Video] = []
              for page in s3.get_paginator("list_objects_v2").paginate(Bucket=bucket, Prefix="backgrounds/"):
                  for obj in page.get("Contents", []):
                      video = valid_video_object(obj)
                      if video:
                          found.append(video)
              return sorted(found, key=lambda v: (v.last_modified, v.key))
          
          
          def key_exists(s3, bucket: str, key: str) -> bool:
              from botocore.exceptions import ClientError
              try:
                  s3.head_object(Bucket=bucket, Key=key)
                  return True
              except ClientError as exc:
                  if str(exc.response.get("Error", {}).get("Code")) in ("404", "NoSuchKey", "NotFound"):
                      return False
                  raise
          
          
          def choose_videos(s3, bucket: str, count: int, *, ai: bool, retry_failed: bool = False) -> tuple[list[Video], int]:
              """Separate preview/AI receipts; a preview cannot block subsequent AI."""
              if not 1 <= count <= 5:
                  raise ValueError("Batch limit must be 1..5")
              selected: list[Video] = []
              pool = list_videos(s3, bucket)
              eligible = len(pool)
              mode = "ai" if ai else "preview"
              for video in pool:
                  if key_exists(s3, bucket, video.prefix + mode + ".json"):
                      continue
                  if not retry_failed and key_exists(s3, bucket, video.prefix + "error_" + mode + ".json"):
                      continue
                  selected.append(video)
                  if len(selected) >= count:
                      break
              return selected, eligible
          
          
          def upload_private(s3, bucket: str, key: str, content: bytes, mime: str) -> None:
              if bucket != BUCKET or not re.fullmatch(
                  r"reviews/auto_vsr/v1/[0-9a-f]{28}/(?:original\.png|before_after\.png|cleaned\.mp4|preview\.json|ai\.json|error_(?:preview|ai)\.json)",
                  key,
              ):
                  raise ValueError("Refusing to write outside the private VSR review area")
              from botocore.exceptions import ClientError
              try:
                  s3.put_object(Bucket=bucket, Key=key, Body=content, ContentType=mime, IfNoneMatch="*")
              except ClientError as err:
                  if str(err.response.get("Error", {}).get("Code")) in ("412", "PreconditionFailed"):
                      # A previous attempt may have uploaded an asset before failing.
                      # Deterministic fingerprints allow safe resumption without overwrite.
                      return
                  raise
          
          
          def run_cmd(args: list[str], timeout: int = 300) -> None:
              subprocess.run(args, check=True, timeout=timeout)
          
          
          def inspect_video(path: Path) -> dict:
              result = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,width,height:format=duration", "-of", "json", str(path)],
                  capture_output=True, text=True, check=True, timeout=60,
              )
              info = json.loads(result.stdout)
              stream = next((v for v in info.get("streams", []) if v.get("codec_type") == "video"), None)
              if not stream or not stream.get("width") or not stream.get("height"):
                  raise RuntimeError("Source/output contains no decodable video stream")
              return {"duration": float(info.get("format", {}).get("duration") or 0),
                      "width": int(stream["width"]), "height": int(stream["height"])}
          
          
          def screenshot(path: Path, dest: Path, at: float) -> None:
              run_cmd(["ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error", "-y", "-ss", str(at),
                       "-i", str(path), "-frames:v", "1", str(dest)], timeout=90)
              if not dest.is_file() or dest.stat().st_size < 100:
                  raise RuntimeError("Could not decode preview frame")
          
          
          def compare(original: Path, cleaned: Path, dest: Path, sample: float) -> dict:
              a, b = dest.parent / "original-sample.png", dest.parent / "clean-sample.png"
              screenshot(original, a, sample)
              screenshot(cleaned, b, sample)
              with Image.open(a) as ia, Image.open(b) as ib:
                  before, after = ia.convert("RGB"), ib.convert("RGB")
              if before.size != after.size:
                  raise RuntimeError("VSR output dimensions changed")
              delta = ImageStat.Stat(ImageChops.difference(before, after).convert("L")).mean[0]
              pair = Image.new("RGB", (before.width * 2, before.height + 30), "#121212")
              pair.paste(before, (0, 30))
              pair.paste(after, (before.width, 30))
              painter = ImageDraw.Draw(pair)
              painter.text((10, 8), "ORIGINAL", fill="white")
              painter.text((before.width + 10, 8), "AI CLEANED (REVIEW REQUIRED)", fill="white")
              pair.save(dest)
              return {"mean_absolute_luma_change": round(delta, 3),
                      "warning": "Minimal visual change; OCR may have missed text" if delta < .25 else None,
                      "human_review_required": True}
          
          
          def process_video(s3, bucket: str, vid: Video, *, ai: bool, max_seconds: float, run_id: str) -> dict:
              if bucket != BUCKET or not 0.5 <= max_seconds <= 90:
                  raise ValueError("Bad bucket/clip duration")
              mode = "ai" if ai else "preview"
              with tempfile.TemporaryDirectory(prefix="piyaso-vsr-auto-") as temp:
                  work = Path(temp)
                  source = work / ("raw" + Path(vid.key).suffix.lower())
                  response = s3.get_object(Bucket=bucket, Key=vid.key)
                  if int(response.get("ContentLength", 0)) > MAX_SOURCE_BYTES:
                      response["Body"].close()
                      raise ValueError("Input exceeds size limit")
                  with response["Body"] as stream:
                      content = stream.read(MAX_SOURCE_BYTES + 1)
                  if len(content) != vid.size or len(content) > MAX_SOURCE_BYTES:
                      raise RuntimeError("Video changed during R2 listing or exceeded limit")
                  source.write_bytes(content)
                  meta = inspect_video(source)
                  duration = min(meta["duration"], max_seconds)
                  if duration < .5:
                      raise RuntimeError("Video is too short")
                  input_file = work / "normalized.mp4"
                  vf = "scale=360:640:force_original_aspect_ratio=increase,crop=360:640,setsar=1,fps=12"
                  run_cmd(["ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error", "-y",
                           "-i", str(source), "-t", str(duration), "-vf", vf, "-an",
                           "-c:v", "libx264", "-preset", "veryfast", "-crf", "20",
                           "-pix_fmt", "yuv420p", str(input_file)], timeout=240)
                  preview = work / "original.png"
                  screenshot(input_file, preview, min(1., duration / 2.))
                  report = {"fingerprint": vid.fingerprint, "source_key": vid.key, "source_etag": vid.etag,
                            "source_size": vid.size, "run_id": run_id, "mode": mode,
                            "model": "VSR sttn-det" if ai else None,
                            "processed_seconds": round(duration, 2),
                            "source_seconds": round(meta["duration"], 2),
                            "truncated": meta["duration"] > max_seconds + .1,
                            "auto_filename_selection": True, "manual_region_required": False,
                            "human_quality_review_required": True,
                            "commercial_rights_approval_required_before_publishing": True,
                            "publish_allowed": False, "buffer_posted": False}
                  # Always store *private* review images, never original raw video or publish URL.
                  upload_private(s3, bucket, vid.prefix + "original.png", preview.read_bytes(), "image/png")
                  if ai:
                      vsr_dir = Path(os.environ.get("VSR_HOME", "vendor/video-subtitle-remover")).resolve()
                      py = os.environ.get("VSR_PYTHON", sys.executable)
                      model = vsr_dir / "backend/models/sttn-det/sttn.pth"
                      main = vsr_dir / "backend/main.py"
                      if not main.is_file() or not model.is_file() or model.stat().st_size < 60_000_000:
                          raise RuntimeError("Real VSR sttn-det model missing; refusing fake AI fallback")
                      clean_no_audio = work / "vsr-no-audio.mp4"
                      # IMPORTANT: NO -c coordinates. VSR OCR detects text automatically.
                      run_cmd([py, str(main), "-i", str(input_file), "-o", str(clean_no_audio),
                               "--inpaint-mode", "sttn-det"], timeout=3600)
                      if not clean_no_audio.is_file() or clean_no_audio.stat().st_size < 1024:
                          raise RuntimeError("VSR did not produce an output")
                      clean = work / "cleaned.mp4"
                      # VSR sees only input-file video; supply audio from the original input.
                      run_cmd(["ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error", "-y",
                               "-i", str(clean_no_audio), "-i", str(source), "-map", "0:v:0",
                               "-map", "1:a?", "-t", str(duration), "-c:v", "copy", "-c:a", "aac",
                               "-b:a", "128k", "-shortest", "-movflags", "+faststart", str(clean)], timeout=300)
                      after_meta = inspect_video(clean)
                      if (after_meta["width"], after_meta["height"]) != (360, 640):
                          raise RuntimeError("Cleaned video is not 360x640")
                      if after_meta["duration"] < max(.5, duration - .7):
                          raise RuntimeError("Cleaned video unexpectedly short")
                      before_after = work / "before_after.png"
                      report["quality"] = compare(input_file, clean, before_after, min(1., duration / 2.))
                      upload_private(s3, bucket, vid.prefix + "before_after.png", before_after.read_bytes(), "image/png")
                      upload_private(s3, bucket, vid.prefix + "cleaned.mp4", clean.read_bytes(), "video/mp4")
                  upload_private(s3, bucket, vid.prefix + mode + ".json",
                                 (json.dumps(report, ensure_ascii=False, indent=2) + "\n").encode("utf-8"),
                                 "application/json")
                  return report
          
          
          def main():
              p = argparse.ArgumentParser(description="Automatically discover R2 videos; STTN-DET private review; never publish")
              p.add_argument("--run-ai", action="store_true")
              p.add_argument("--retry-failed", action="store_true")
              p.add_argument("--max-videos", type=int, default=2)
              p.add_argument("--max-seconds", type=float, default=18)
              args = p.parse_args()
              if not .5 <= args.max_seconds <= 90:
                  p.error("--max-seconds must be between .5 and 90")
              s3 = storage_client.client()
              bucket = storage_client.bucket_name("assets")
              if bucket != BUCKET:
                  raise RuntimeError("Unexpected R2 bucket")
              videos, pool_count = choose_videos(s3, bucket, args.max_videos,
                                                ai=args.run_ai, retry_failed=args.retry_failed)
              print(f"Found {pool_count} usable R2 backgrounds; selected {len(videos)} oldest unprocessed files.", flush=True)
              mode = "ai" if args.run_ai else "preview"
              successes = 0
              failures = 0
              run_id = os.getenv("GITHUB_RUN_ID", "local")
              for video in videos:
                  print(f"Starting {video.key} ({video.fingerprint})", flush=True)
                  try:
                      result = process_video(s3, bucket, video, ai=args.run_ai,
                                             max_seconds=args.max_seconds, run_id=run_id)
                      print("PRIVATE REVIEW COMPLETE: " + video.prefix + mode + ".json", flush=True)
                      if result["truncated"]:
                          print("WARNING: Source longer than max_seconds; output is a review sample, not a full edit.", flush=True)
                      successes += 1
                  except Exception as err:
                      failures += 1
                      print(f"Failed {video.key}: {type(err).__name__}: {str(err)[:300]}", file=sys.stderr, flush=True)
                      error = {"source_key": video.key, "status": "failed", "mode": mode,
                               "error_type": type(err).__name__, "error_detail": str(err)[:600],
                               "human_review_required": True, "publish_allowed": False}
                      upload_private(s3, bucket, video.prefix + "error_" + mode + ".json",
                                     (json.dumps(error, ensure_ascii=False) + "\n").encode(), "application/json")
              summary = (f"### Piyaso automatic VSR (private only)\n"
                         f"- Found {pool_count} candidate videos in R2 `backgrounds/`\n"
                         f"- Selected {len(videos)} new/unfinished videos (max {args.max_videos})\n"
                         f"- Mode: {mode} (no manual filenames / no manual coordinates)\n"
                         f"- Success: {successes}, failure: {failures}\n"
                         f"- Results: R2 `reviews/auto_vsr/v1/`\n"
                         f"- **No Buffer or TikTok posting; human review and rights required**\n")
              print(summary, flush=True)
              if os.getenv("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                      out.write(summary)
              if failures:
                  raise SystemExit(1)
          
          
          if __name__ == "__main__":
              main()
          PY
          args=(--max-videos "$MAX_VIDEOS" --max-seconds "$MAX_SECONDS")
          if [[ "$RUN_AI" == "true" ]]; then args+=(--run-ai); fi
          if [[ "$RETRY_FAILED" == "true" ]]; then args+=(--retry-failed); fi
          python auto_vsr_r2.py "${args[@]}"
