name: Piyasoo - Paylasimsiz regresyon testleri
on:
  push:
    branches: [main]
    paths: ['*.py', '*.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Isolated tests without R2 or Buffer credentials
        run: python -m unittest discover -p 'test_*.py' -q
